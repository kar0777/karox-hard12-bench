# HARD12 gateway (FreeInference upstream, D-026 dev lane): a DIFFERENT model, GLM-5.3-Flash
# (free, $80/day quota, 2 concurrent requests per key). Never mix its results with the
# DeepSeek-V4.1-Flash-1017 runs. Per-arm aliases for accounting only. Profile:
# config/inference_profile_hard12_freeinference.json. Key only from FREEINFERENCE_API_KEY.
model_list:
  - model_name: hard12-karox5
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://freeinference.org/v1
      api_key: os.environ/FREEINFERENCE_API_KEY
      use_chat_completions_api: true
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 32768
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_reasoning: true
      supports_vision: false
