# HARD12 gateway (OpenRouter GLM dev lane): a DIFFERENT model, GLM-5.3-Flash :batch
# (cheapest tier), on the user's small OpenRouter balance. Never mix its results with the
# DeepSeek-V4.1-Flash-1017 runs. Profile: config/inference_profile_hard12_orglm.json.
# Key only from OPENROUTER_API_KEY.
model_list:
  - model_name: hard12-karox5
    litellm_params:
      model: openai/z-ai/glm-5.3-flash:batch
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      use_chat_completions_api: true
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 32768
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_reasoning: true
      supports_vision: false
