# HARD12 gateway (OpenRouter free lane): particle-ai/particle-1:free, a DeepSeek-V4.1-Flash fine-tune,
# free (20 req/min, 1000 req/day on the key). Consumption comparisons only, not the bench model.
# Never mix with bench results. Profile: config/inference_profile_hard12_orfree.json.
# Key only from OPENROUTER_API_KEY.
model_list:
  - model_name: hard12-karox5
    litellm_params:
      model: openai/particle-ai/particle-1:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      use_chat_completions_api: true
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 32768
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_reasoning: true
      supports_vision: false
