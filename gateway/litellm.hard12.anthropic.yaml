# HARD12 gateway (Anthropic lane): claude-haiku-5-5, the user's API credit ($0.10/$0.50 per 1M
# up to 100K-token prompts, 5x beyond). A different model: never mix with GLM/DSV results.
# Prompt caching injected on the system prompt and the last message. Key only from ANTHROPIC_API_KEY.
model_list:
  - model_name: hard12-karox5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 32768
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_reasoning: true
      supports_vision: false
