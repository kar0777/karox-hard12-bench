name: probe-datasets
on:
  workflow_dispatch:
    inputs:
      datasets:
        default: ''
      full_tar:
        default: ''
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe_datasets.sh
        env:
          DATASETS: ${{ inputs.datasets }}
          FULL_TAR: ${{ inputs.full_tar }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: out
