name: probe-datasets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe_datasets.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: out
