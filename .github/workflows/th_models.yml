name: th-models
on: workflow_dispatch
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List Token Harbor models (ids and pricing only)
        env:
          TH_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
        run: |
          curl -sS -H "Authorization: Bearer $TH_KEY" https://tokenharbor.ai/v1/models -o models.json
          python3 - <<'PY'
          import json
          d = json.load(open("models.json"))
          items = d.get("data", d if isinstance(d, list) else [])
          print("count", len(items))
          for m in items:
              keep = {k: m.get(k) for k in ("id", "pricing", "context_length", "owned_by") if k in m}
              print(json.dumps(keep, ensure_ascii=False)[:300])
          if not items:
              print(json.dumps(d)[:500])
          PY
