name: th-models
on:
  push:
    branches: [devin/bench]
    paths: [".github/workflows/th_models.yml"]
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Enable free models (user consent 2026-11-23) and test one free call
        env:
          TH_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
        run: |
          echo "privacy:"; curl -sS -X POST -H "Authorization: Bearer $TH_KEY" -H "Content-Type: application/json" \
            -d '{"free_models_enabled": true}' https://tokenharbor.ai/api/me/privacy | head -c 400; echo
          echo "free call:"; curl -sS -H "Authorization: Bearer $TH_KEY" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4.1-flash:free","messages":[{"role":"user","content":"Say OK"}],"max_tokens":5}' \
            https://tokenharbor.ai/v1/chat/completions | head -c 400; echo
