name: diagnose
on:
  workflow_dispatch:
    inputs:
      spec_probe:
        description: "probes/<dir> to run the spec-reviewer probe on instead of the diagnose matrix (empty: diagnose)"
        default: ""
      samples:
        description: "spec probe: reviewer samples per case"
        default: "2"
      probe_workers:
        description: "spec probe: concurrent requests from this one runner"
        default: "4"
      probe_wheel:
        description: "spec probe: karox6 wheel in wheels/ to run the reviewer as an agent (empty: one model call)"
        default: ""
permissions:
  contents: read
jobs:
  plan:
    if: inputs.spec_probe == ''
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix={\"n\":[$(ls data/diag | sort -n | paste -sd,)]}" >> "$GITHUB_OUTPUT"
  diag:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/diagnose_one.sh ${{ matrix.n }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.n }}
          path: out/${{ matrix.n }}
          retention-days: 30
  spec_probe:
    # Model-only probe (no agent); key only from the REFORMBOSS_API_KEY secret.
    if: inputs.spec_probe != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          REFORMBOSS_API_KEY: ${{ secrets.REFORMBOSS_API_KEY }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          DAHL_API_KEY_2: ${{ secrets.DAHL_API_KEY_2 }}
          DAHL_API_KEY_3: ${{ secrets.DAHL_API_KEY_3 }}
          DAHL_API_KEY_4: ${{ secrets.DAHL_API_KEY_4 }}
          DAHL_API_KEY_5: ${{ secrets.DAHL_API_KEY_5 }}
          DAHL_API_KEY_6: ${{ secrets.DAHL_API_KEY_6 }}
          DAHL_API_KEY_7: ${{ secrets.DAHL_API_KEY_7 }}
          DAHL_API_KEY_8: ${{ secrets.DAHL_API_KEY_8 }}
          DAHL_API_KEY_9: ${{ secrets.DAHL_API_KEY_9 }}
          DAHL_API_KEY_10: ${{ secrets.DAHL_API_KEY_10 }}
          DAHL_API_KEY_11: ${{ secrets.DAHL_API_KEY_11 }}
          DAHL_API_KEY_12: ${{ secrets.DAHL_API_KEY_12 }}
          DAHL_API_KEY_13: ${{ secrets.DAHL_API_KEY_13 }}
          DAHL_API_KEY_14: ${{ secrets.DAHL_API_KEY_14 }}
          DAHL_API_KEY_15: ${{ secrets.DAHL_API_KEY_15 }}
          DAHL_API_KEY_16: ${{ secrets.DAHL_API_KEY_16 }}
          DAHL_API_KEY_17: ${{ secrets.DAHL_API_KEY_17 }}
          DAHL_API_KEY_18: ${{ secrets.DAHL_API_KEY_18 }}
          DAHL_API_KEY_19: ${{ secrets.DAHL_API_KEY_19 }}
          DAHL_API_KEY_20: ${{ secrets.DAHL_API_KEY_20 }}
          DAHL_API_KEY_21: ${{ secrets.DAHL_API_KEY_21 }}
          DAHL_API_KEY_22: ${{ secrets.DAHL_API_KEY_22 }}
          DAHL_API_KEY_23: ${{ secrets.DAHL_API_KEY_23 }}
          DAHL_API_KEY_24: ${{ secrets.DAHL_API_KEY_24 }}
          DAHL_API_KEY_25: ${{ secrets.DAHL_API_KEY_25 }}
          DAHL_API_KEY_26: ${{ secrets.DAHL_API_KEY_26 }}
          DAHL_API_KEY_27: ${{ secrets.DAHL_API_KEY_27 }}
          DAHL_API_KEY_28: ${{ secrets.DAHL_API_KEY_28 }}
          DAHL_API_KEY_29: ${{ secrets.DAHL_API_KEY_29 }}
          DAHL_API_KEY_30: ${{ secrets.DAHL_API_KEY_30 }}
          DAHL_API_KEY_31: ${{ secrets.DAHL_API_KEY_31 }}
          DAHL_API_KEY_32: ${{ secrets.DAHL_API_KEY_32 }}
          DAHL_API_KEY_33: ${{ secrets.DAHL_API_KEY_33 }}
          DAHL_API_KEY_34: ${{ secrets.DAHL_API_KEY_34 }}
          DAHL_API_KEY_35: ${{ secrets.DAHL_API_KEY_35 }}
          DAHL_API_KEY_36: ${{ secrets.DAHL_API_KEY_36 }}
          DAHL_API_KEY_37: ${{ secrets.DAHL_API_KEY_37 }}
          DAHL_API_KEY_38: ${{ secrets.DAHL_API_KEY_38 }}
          DAHL_API_KEY_39: ${{ secrets.DAHL_API_KEY_39 }}
          DAHL_API_KEY_40: ${{ secrets.DAHL_API_KEY_40 }}
          CASES: ${{ inputs.spec_probe }}
          SAMPLES: ${{ inputs.samples }}
          WHEEL: ${{ inputs.probe_wheel }}
          # ReformBoss allows 4 concurrent requests per key; run nothing else meanwhile.
          PROBE_WORKERS: ${{ inputs.probe_workers }}
        run: |
          if [ -f "probes/$CASES/.replay" ]; then
            python3 scripts/replay_probe.py "probes/$CASES" out "$SAMPLES"
          elif [ -n "$WHEEL" ]; then
            python3 -m venv /tmp/kv
            /tmp/kv/bin/pip install --quiet "wheels/$WHEEL"
            /tmp/kv/bin/python scripts/spec_probe_agent.py "probes/$CASES" out "$SAMPLES"
          else
            python3 scripts/spec_probe.py "probes/$CASES" out "$SAMPLES"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-probe
          path: out
          retention-days: 30
