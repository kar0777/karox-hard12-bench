name: diagnose
on:
  workflow_dispatch:
    inputs:
      spec_probe:
        description: "probes/<dir> to run the spec-reviewer probe on instead of the diagnose matrix (empty: diagnose)"
        default: ""
      samples:
        description: "spec probe: reviewer samples per case"
        default: "2"
      probe_workers:
        description: "spec probe: concurrent requests from this one runner"
        default: "4"
      probe_wheel:
        description: "spec probe: karox6 wheel in wheels/ to run the reviewer as an agent (empty: one model call)"
        default: ""
permissions:
  contents: read
jobs:
  plan:
    if: inputs.spec_probe == ''
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix={\"n\":[$(ls data/diag | sort -n | paste -sd,)]}" >> "$GITHUB_OUTPUT"
  diag:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/diagnose_one.sh ${{ matrix.n }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.n }}
          path: out/${{ matrix.n }}
          retention-days: 30
  spec_probe:
    # Model-only probe (no agent); key only from the REFORMBOSS_API_KEY secret.
    if: inputs.spec_probe != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          REFORMBOSS_API_KEY: ${{ secrets.REFORMBOSS_API_KEY }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          DAHL_API_KEY_2: ${{ secrets.DAHL_API_KEY_2 }}
          CASES: ${{ inputs.spec_probe }}
          SAMPLES: ${{ inputs.samples }}
          WHEEL: ${{ inputs.probe_wheel }}
          # ReformBoss allows 4 concurrent requests per key; run nothing else meanwhile.
          PROBE_WORKERS: ${{ inputs.probe_workers }}
        run: |
          if [ -f "probes/$CASES/.replay" ]; then
            python3 scripts/replay_probe.py "probes/$CASES" out "$SAMPLES"
          elif [ -n "$WHEEL" ]; then
            python3 -m venv /tmp/kv
            /tmp/kv/bin/pip install --quiet "wheels/$WHEEL"
            /tmp/kv/bin/python scripts/spec_probe_agent.py "probes/$CASES" out "$SAMPLES"
          else
            python3 scripts/spec_probe.py "probes/$CASES" out "$SAMPLES"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-probe
          path: out
          retention-days: 30
