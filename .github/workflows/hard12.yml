name: hard12
on:
  workflow_dispatch:
    inputs:
      arms:
        description: "comma list: karox5,karox6,karox6b,opencode_v2,deepseek_harness; a+b runs arms side by side in one job; trio = karox6+opencode_v2+deepseek_harness"
        default: "karox5,opencode_v2,deepseek_harness"
      tasks:
        description: "comma list of task numbers 1..12 (empty = all)"
        default: ""
      attempts:
        description: "independent attempts per task x arm"
        default: "3"
      tag:
        description: "run tag [a-z0-9]"
        default: "gha"
      taskset:
        description: "data/sets/<name>.txt (empty = HARD12 night_tasks)"
        default: ""
      upstream:
        description: "model provider: wandb | synthetic | runcrate | reformboss (same model DSV4.1F-1017; reformboss: parallel <= 3) | openrouter (same model, fp8 providers, cached) | freeinference (D-026: GLM-5.3-Flash, a different model, dev lane only) | dahl (GLM-5.3-Flash dev lane, 3 concurrent: parallel <= 3) | orglm (GLM-5.3-Flash on OpenRouter, small balance) | dahl2 (Dahl GLM, every DAHL_API_KEY[_2.._9] secret set: 3 parallel requests per key)"
        default: "wandb"
      parallel:
        description: "max parallel jobs"
        default: "20"
      karox6_flags:
        description: "extra `karox run` flags for the karox6 arm (A/B variants)"
        default: ""
      karox6_wheel:
        description: "karox6 wheel file name under wheels/ (empty = the newest by name)"
        default: ""
      karox6b_flags:
        description: "extra `karox run` flags for the karox6b arm (A/B in the same job)"
        default: ""
      karox6b_wheel:
        description: "wheel for the karox6b arm (empty = the karox6 one)"
        default: ""
      chunk:
        description: "tasks per job, run one after another on one runner (one IP); 1 = a job per task"
        default: "1"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ARMS: ${{ inputs.arms }}
          TASKS: ${{ inputs.tasks }}
          TASKSET: ${{ inputs.taskset }}
          CHUNK: ${{ inputs.chunk }}
        run: python3 scripts/plan_matrix.py >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.parallel) }}
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.n }}-${{ matrix.armname }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h / | tail -1
      - name: Tools (pinned)
        run: |
          python3 -m pip install --user --break-system-packages uv
          ~/.local/bin/uv tool install --python 3.12 harbor==0.23.0
          ~/.local/bin/uv tool install --python 3.12 'litellm[proxy]==1.91.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          docker pull -q alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
      - name: Run
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          RUNCRATE_API_KEY: ${{ secrets.RUNCRATE_API_KEY }}
          REFORMBOSS_API_KEY: ${{ secrets.REFORMBOSS_API_KEY }}
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          DAHL_API_KEY_2: ${{ secrets.DAHL_API_KEY_2 }}
          DAHL_API_KEY_3: ${{ secrets.DAHL_API_KEY_3 }}
          DAHL_API_KEY_4: ${{ secrets.DAHL_API_KEY_4 }}
          DAHL_API_KEY_5: ${{ secrets.DAHL_API_KEY_5 }}
          DAHL_API_KEY_6: ${{ secrets.DAHL_API_KEY_6 }}
          DAHL_API_KEY_7: ${{ secrets.DAHL_API_KEY_7 }}
          DAHL_API_KEY_8: ${{ secrets.DAHL_API_KEY_8 }}
          DAHL_API_KEY_9: ${{ secrets.DAHL_API_KEY_9 }}
          UPSTREAM: ${{ inputs.upstream }}
          TASK: ${{ matrix.task }}
          N: ${{ matrix.nums }}
          ARM: ${{ matrix.arm }}
          ATT: ${{ inputs.attempts }}
          TAG: ${{ inputs.tag }}
          HARD12_KAROX6_FLAGS: ${{ inputs.karox6_flags }}
          HARD12_KAROX6_WHEEL: ${{ inputs.karox6_wheel && format('{0}/wheels/{1}', github.workspace, inputs.karox6_wheel) || '' }}
          HARD12_KAROX6B_FLAGS: ${{ inputs.karox6b_flags }}
          HARD12_KAROX6B_WHEEL: ${{ inputs.karox6b_wheel && format('{0}/wheels/{1}', github.workspace, inputs.karox6b_wheel) || '' }}
        run: bash scripts/ci_run.sh "$TASK" "$N" "$ARM" "$ATT" "$TAG"
      - name: Collect
        if: always()
        run: |
          W="$RUNNER_TEMP/h12"; mkdir -p out
          find "$W/jobs" -name '*.log' -size +20M -delete 2>/dev/null || true
          cp -r "$W/jobs" out/ 2>/dev/null || true
          cp "$W/audit/audit.jsonl" "out/audit-${{ matrix.n }}-${{ matrix.armname }}.jsonl" 2>/dev/null || true
          mkdir -p out/gw && tail -200 "$W/logs/litellm.log" > out/gw/litellm-tail.log 2>/dev/null || true
          cp "$W/logs/vmstat.log" out/gw/ 2>/dev/null || true
          df -h / | tail -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-${{ matrix.n }}-${{ matrix.armname }}
          path: out
          retention-days: 30
  report:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
      - name: Report
        run: |
          mkdir -p merged/jobs
          for d in arts/trial-*/; do cp -r "$d"jobs/* merged/jobs/ 2>/dev/null || true; done
          cat arts/trial-*/audit-*.jsonl > merged/audit.jsonl 2>/dev/null || touch merged/audit.jsonl
          H12_JOBS=merged/jobs H12_AUDIT=merged/audit.jsonl H12_OUT=merged \
            H12_VAL=data/validation_slim.jsonl H12_TASKS=data/night_tasks.txt python3 scripts/hard12_report.py
          cat merged/HARD12_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/time_breakdown.py merged/jobs merged/audit.jsonl merged/TIME_BREAKDOWN             && cat merged/TIME_BREAKDOWN.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: HARD12_RESULTS
          path: |
            merged/HARD12_RESULTS.*
            merged/TIME_BREAKDOWN.*
