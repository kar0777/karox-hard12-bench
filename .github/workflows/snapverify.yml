name: snapverify
# Model-less: grade every submitted-finish snapshot a KaroX trial kept against
# the task's hidden tests, to score the first finish against the final one.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "hard12 run id whose trial artifacts to grade"
        required: true
      arm:
        description: "arm suffix of the trial artifacts"
        default: "karox5"
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id }}
          ARM: ${{ inputs.arm }}
        run: |
          names=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/artifacts?per_page=100" \
            -q ".artifacts[].name | select(startswith(\"trial-\") and endswith(\"-$ARM\"))")
          python3 -c "import json,sys;print('matrix='+json.dumps({'art':sys.argv[1].split()}))" "$names" >> "$GITHUB_OUTPUT"
  grade:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.art }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.art }}
          path: art
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python3 scripts/snap_verify.py art "out/${{ matrix.art }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-${{ matrix.art }}
          path: out
          retention-days: 30
